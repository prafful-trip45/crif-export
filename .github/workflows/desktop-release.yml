name: desktop-release

# Builds the CRIF Export desktop app for macOS (Apple Silicon + Intel) and
# Windows. A Windows .exe/.msi cannot be cross-compiled from macOS, so each
# target builds on its own native runner.
#
# Trigger by pushing a tag like `desktop-v0.1.0`, or run manually from the
# Actions tab. On a tag push the installers are attached to a draft GitHub
# Release; manual runs upload them as workflow artifacts.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Installer (.exe / .msi)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      # The desktop app imports the shared engine from packages/core/src via
      # relative paths, and that code imports `exceljs`. Vite/Rollup resolves
      # those bare imports from the core source location, so `exceljs` must exist
      # in an ancestor node_modules of packages/core — i.e. the repo ROOT. Install
      # there too, not just in packages/desktop, or the build fails with
      # "Rollup failed to resolve import 'exceljs'".
      - name: Install root deps (shared core engine)
        run: npm install

      - name: Install frontend deps
        working-directory: packages/desktop
        run: npm install

      # The login gate is active only when VITE_LICENSE_SERVER_URL is baked into the
      # frontend at build time (see auth.ts). vite.config.ts resolves it from
      # process.env (injected below) so it works regardless of CWD/.env location.
      # Build the frontend explicitly and FAIL the job if the gate URL isn't present
      # in dist — so we never silently ship an installer that opens with no login.
      - name: Build frontend + verify login gate is baked in
        working-directory: packages/desktop
        shell: bash
        env:
          VITE_LICENSE_SERVER_URL: ${{ secrets.VITE_LICENSE_SERVER_URL }}
        run: |
          if [ -z "$VITE_LICENSE_SERVER_URL" ]; then
            echo "::error::VITE_LICENSE_SERVER_URL secret is empty — build would have NO login gate."
            exit 1
          fi
          npm run build
          HOST="$(echo "$VITE_LICENSE_SERVER_URL" | sed -E 's#https?://##; s#/.*##')"
          if grep -rq "$HOST" dist; then
            echo "Login gate baked into dist ($HOST) ✓"
          else
            echo "::error::Login-gate URL ($HOST) NOT found in built frontend — gate would be OFF."
            exit 1
          fi

      # tauri-action re-runs beforeBuildCommand (npm run build) itself, and THAT rebuild
      # was landing an ungated dist (the URL wasn't reaching it) — overwriting the
      # verified dist above. Clear beforeBuildCommand so Tauri bundles the EXACT dist we
      # just built and verified, instead of rebuilding it.
      - name: Bundle the verified frontend (disable Tauri's own rebuild)
        working-directory: packages/desktop/src-tauri
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.build.beforeBuildCommand='';fs.writeFileSync(f,JSON.stringify(c,null,2));"
          echo "Cleared beforeBuildCommand — Tauri will bundle the pre-built, verified dist"

      - name: Build app (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # vite.config reads this from process.env and bakes it via `define`.
          VITE_LICENSE_SERVER_URL: ${{ secrets.VITE_LICENSE_SERVER_URL }}
        with:
          projectPath: packages/desktop
          # On a tag push, create/append to a draft release. Empty tagName on
          # workflow_dispatch keeps it as artifacts only.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "CRIF Export ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: crif-export-windows
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/**/release/bundle/**/*.exe
            packages/desktop/src-tauri/target/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
